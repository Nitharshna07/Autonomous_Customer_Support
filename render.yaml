services:
  - type: web
    name: autonomous-support-copilot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    pythonVersion: "3.11.9"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 423149665404-b9bp7ruhjgind0avu27k49pb9eu3fja5.apps.googleusercontent.com
      - key: FRONTEND_URL
        value: https://autonomous-customer-support-copilot.netlify.app
    plan: free
